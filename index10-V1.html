<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mapa Oportunidades 10 Países — Metro de Medellín</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}

/* HEADER */
.hdr{background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 8px;position:relative;z-index:1100}
.hdr-logo{height:40px;object-fit:contain;flex-shrink:0}
.nav{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.nav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .2s;white-space:nowrap}
.nav button:hover,.nav button.active{background:#00AA44;color:#fff;font-weight:600;border-color:#00AA44}

/* MAP */
#map{position:absolute;top:48px;left:0;right:0;bottom:0;z-index:1}

/* POPUPS - responsive */
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:0;overflow:hidden}
.leaflet-popup-content{margin:0!important;padding:0!important;min-width:220px;max-width:min(330px,85vw)}
.pp-top{min-height:46px;display:flex;align-items:center;gap:6px;padding:4px 10px}
.pp-ico{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.2);flex-shrink:0}
.pp-tm{flex:1;min-width:0}.pp-tm h3{font-size:11px;font-weight:600;color:#fff;line-height:1.2;margin:0;overflow-wrap:break-word}.pp-tm small{font-size:8px;color:rgba(255,255,255,.8)}
.pp-body{padding:6px 10px 8px}
.pp-code{display:inline-block;background:#1F4E79;color:#fff;font-size:8px;padding:1px 4px;border-radius:3px;margin-bottom:3px}
.pp-r{font-size:9px;margin:1px 0;color:#444;line-height:1.3}.pp-r b{color:#1F4E79}
.pp-ins{font-size:8px;color:#555;margin-top:4px;padding:4px 6px;background:#f0f4f8;border-radius:4px;border-left:3px solid #00AA44;line-height:1.2}
.pp-rec{margin-top:2px;font-size:8px;color:#00773A;font-weight:600}

/* LEGEND */
.lgd{position:absolute;bottom:12px;left:6px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:6px 8px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:1000;max-width:min(240px,60vw);max-height:35vh;overflow-y:auto}
.lgd-title{font-size:10px;color:#00773A;font-weight:600;margin-bottom:3px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.lgd-title span{font-size:12px;opacity:.5}
.lgd-grid{display:flex;flex-direction:column;gap:1px}
.lgd-chip{display:flex;align-items:center;gap:3px;font-size:8px;color:#333;background:#f4f6f8;padding:1px 5px 1px 2px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgd-chip .ci{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.lgd.collapsed .lgd-grid{display:none}

/* SIDEBAR */
.sidebar{position:absolute;top:0;right:0;width:min(260px,80vw);height:100%;background:#fff;z-index:1100;overflow-y:auto;border-left:1px solid #ddd;display:none}
.sidebar.open{display:block}
.sidebar h3{padding:8px 10px;background:#00773A;color:#fff;font-size:11px;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:2}
.sidebar h3 span{cursor:pointer;font-size:14px}
.pi{padding:5px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;font-size:10px}
.pi:hover{background:#f0f8f4}
.pi .mic{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
.pi .pn{font-weight:600;color:#00773A;font-size:9px;line-height:1.2}
.pi .pc{font-size:8px;color:#999}

/* MOBILE: stack nav below logo */
@media(max-width:700px){
  .hdr{height:auto;flex-wrap:wrap;padding:4px 6px;gap:4px}
  .hdr-logo{height:32px}
  .nav{gap:2px}
  .nav button{font-size:9px;padding:3px 6px}
  #map{top:0;position:absolute;left:0;right:0;bottom:0}
  .lgd{bottom:8px;left:4px;max-width:55vw;max-height:30vh;font-size:8px}
  .lgd-chip{font-size:7px}
}
</style>
</head>

// Fix map container offset on mobile
function fixLayout(){
  var h=document.getElementById('hdr').offsetHeight;
  document.getElementById('mapWrap').style.top=h+'px';
  if(window._map)window._map.invalidateSize();
}
window.addEventListener('resize',fixLayout);
setTimeout(fixLayout,100);

var map=L.map('map',{zoomControl:true,attributionControl:false}).setView([8,-80],4);
window._map=map;
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
L.control.attribution({position:'bottomright',prefix:false}).addTo(map).addAttribution('OSM | CARTO');

function mkI(d){var t=gt(d.ca);return L.divIcon({className:'',html:'<div style="width:26px;height:26px;background:'+t.color+';border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid rgba(255,255,255,.9)">'+t.icon+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]})}

function mkP(d){var t=gt(d.ca);return '<div class="pp-top" style="background:'+t.color+'"><div class="pp-ico">'+t.icon+'</div><div class="pp-tm"><h3>'+d.pr+'</h3><small>'+d.ca+' · '+d.pa+'</small></div></div><div class="pp-body"><span class="pp-code">'+d.c+'</span><div class="pp-r"><b>Ciudad:</b> '+d.ci+' · <b>Hz:</b> '+d.hz+'</div><div class="pp-r"><b>Tipo:</b> '+d.ti+' · <b>Ticket:</b> '+d.tk+'</div><div class="pp-r"><b>Actor:</b> '+d.ac+'</div><div class="pp-r"><b>Encaje:</b> '+d.en+' · <b>Rol:</b> '+d.ro+'</div><div class="pp-ins">'+d.ins+'</div><div class="pp-rec">'+d.re+'</div></div>'}

var layers=[];
function render(f){
  layers.forEach(function(l){map.removeLayer(l)});layers=[];
  var items=f==='all'?D:D.filter(function(x){
    var m={'peru':'Perú','panama':'Panamá','rd':'Rep. Dominicana','sv':'El Salvador','cr':'Costa Rica','ec':'Ecuador','gt':'Guatemala','mx':'México','bo':'Bolivia','cl':'Chile'};
    return x.pa===m[f];
  });
  items.forEach(function(d){
    var t=gt(d.ca);
    if(d.rt){var o={color:t.color,weight:4,opacity:.75};if(d.da)o.dashArray=d.da;var ln=L.polyline(d.rt,o).addTo(map);ln.bindPopup(mkP(d),{maxWidth:320});ln.bindTooltip(d.rl||d.pr,{permanent:false,direction:'center',className:'rt-tip'});layers.push(ln)}
    if(d.r2){var o2={color:t.color,weight:3,opacity:.6};if(d.da)o2.dashArray=d.da;var l2=L.polyline(d.r2,o2).addTo(map);l2.bindPopup(mkP(d),{maxWidth:320});l2.bindTooltip(d.r2l||'',{permanent:false,direction:'center'});layers.push(l2)}
    var m=L.marker([d.la,d.lo],{icon:mkI(d)}).addTo(map);m.bindPopup(mkP(d),{maxWidth:320});m._projCode=d.c;m._projLat=d.la;layers.push(m);
  });
  if(layers.length){var fg=L.featureGroup(layers);map.fitBounds(fg.getBounds().pad(.1))}
  var grid=document.getElementById('lgd-grid');grid.innerHTML='';
  items.forEach(function(d){var t=gt(d.ca);grid.innerHTML+='<div class="lgd-chip"><div class="ci" style="background:'+t.color+'">'+t.icon+'</div>'+d.pr+'</div>'});
  document.getElementById('sb-count').textContent=items.length;
  bList(items);
}

function sv(v,el){
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});
  if(el)el.classList.add('active');
  render(v);
  closeSidebar();
}

function toggleSidebar(){document.getElementById('sb').classList.toggle('open')}
function closeSidebar(){document.getElementById('sb').classList.remove('open')}

function bList(items){
  var el=document.getElementById('pl');el.innerHTML='';
  items.forEach(function(d){
    var t=gt(d.ca);
    var div=document.createElement('div');div.className='pi';
    div.innerHTML='<div class="mic" style="background:'+t.color+'">'+t.icon+'</div><div><div class="pn">'+d.pr+'</div><div class="pc">'+d.c+' · '+d.pa+'</div></div>';
    div.onclick=function(){
      closeSidebar();
      map.setView([d.la,d.lo],d.rt&&d.rt.length>3?11:13);
      setTimeout(function(){layers.forEach(function(l){if(l._projCode===d.c)l.openPopup()})},400);
    };
    el.appendChild(div);
  });
}

render('all');
setTimeout(fixLayout,300);
</script>
